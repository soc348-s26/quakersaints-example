name: Build Quaker Saints

on:
  push:
  branches:
  - main
pull_request:
  branches:
  - main
workflow_dispatch:

  jobs:
  build-markdown:
  runs-on: ubuntu-latest
  permissions:
      contents: write  

  steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        run: |
              install.packages(c('rmarkdown', 'tidytext', 'cluster',
              'factoextrar', 'dplyr', 'tidyr', 'ggplot2',
              'stringr', 'here', 'RColorBrewer', 'wordcloud',
              'kableExtra', 'ggrepel', 'pagedown'),
                   repos = 'https://cloud.r-project.org')
        shell: Rscript {0}
      - name: Install GitHub Package
        run: |
              install.packages("remotes")
              remotes::install_github("brentthorne/posterdown")
        shell: Rscript {0}
        
      - name: Render files
        run: |
               rmarkdown::render('sentiments_bing.Rmd, output_format = "md_document"')
               rmarkdown::render('sentiments_nrc.Rmd', output_format = "md_document")
               rmarkdown::render('sentiments_afinn.Rmd, output_format = "md_document"')
               rmarkdown::render('stemming.Rmd', output_format = "md_document")
               rmarkdown::render('clustering_nrc.Rmd', output_format = "md_document")
               rmarkdown::render('poster.Rmd', output_format = "md_document")
       shell: Rscript {0}
